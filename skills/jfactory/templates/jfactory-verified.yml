# Copy to .github/workflows/jfactory-verified.yml during setup and set JFACTORY_DIR to the
# installed bundle path. Make the "jfactory verified" status a required check on the base branch.
# The job runs the PR base branch's copy of the script and mapping, never code from the PR.
# Comment events run this workflow from the default branch, so it takes effect there once merged.
name: jfactory verified
# pull_request_target and issue_comment both load this file from the base or default branch,
# so a PR cannot edit the steps that publish its own status.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: read
  statuses: write
  # The status counts a verified verdict only while CI at the PR head is green.
  checks: read
concurrency:
  group: jfactory-verified-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
env:
  JFACTORY_DIR: .agents/skills/jfactory
jobs:
  status:
    if: >-
      (github.event_name == 'pull_request_target' && !github.event.pull_request.head.repo.fork) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request)
    # Machines you own when the JFACTORY_RUNNER variable says so (references/ci-runners.md), otherwise GitHub's; fork PRs always GitHub's.
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.JFACTORY_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Resolve the PR's base branch
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: echo "ref=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate the independent verdict at the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: >-
          python3 "$JFACTORY_DIR/scripts/verify_plan.py" --repo "$GITHUB_REPOSITORY" check --pr "$PR"
          --set-status --target-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
