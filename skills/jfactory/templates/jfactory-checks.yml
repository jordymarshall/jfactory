# Copy to .github/workflows/jfactory-checks.yml during setup, set JFACTORY_DIR to the installed bundle path and
# SHARDS to the mapping's "shards". Add the project's runtime steps where marked (for example actions/setup-node
# and npm ci), then make the "checks" job a required check.
#
# The map job fails once when a tracked file is unmapped; the suite jobs still run (with --no-audit), so one stray file
# fails one job, not every shard. A PR runs only the suites the change needs: the map's, plus
# every suite whose recorded coverage executed a changed file. The suites are split across parallel jobs by their
# recorded minutes. Under the default minimum gates (`"pr_journeys": false`) no PR or merge runs a journey; the
# whole-suite run does. With `"pr_journeys": true` (owner opt-in), a PR runs journey suites only for changes users can
# see (`ci --pr`), and the push after merge runs the journeys of every feature whose code changed (`ci --push`). The whole suite runs when the owner's "full_suite" choice in the mapping says so (on request,
# nightly, on every merge or on every PR); each such run also records the coverage later PRs use.
name: jfactory checks
on:
  pull_request:
    # No `labeled`: every label change (a hold, a status label) would cancel and restart the run. The mode job reads
    # the full-suite label live, so add the label, then re-run the run's jobs (references/ci-runners.md).
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  # The mode job reads the PR's labels live.
  issues: read
  pull-requests: read
env:
  JFACTORY_DIR: .agents/skills/jfactory
# A newer push to a PR cancels that PR's older run, so the one-minute debounce in `mode` lets a quick second push
# replace the first before any big job starts. Base-branch, schedule and manual runs never cancel each other.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('jfactory-checks-pr-{0}', github.event.pull_request.number) || format('jfactory-checks-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mode:
    # Machines you own when the JFACTORY_RUNNER variable says so (references/ci-runners.md), otherwise GitHub's; fork PRs always GitHub's.
    # Small jobs (mode, map, checks) prefer the light pool (JFACTORY_LIGHT_RUNNER), so they never wait behind a long suite.
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.JFACTORY_LIGHT_RUNNER || vars.JFACTORY_RUNNER || '"ubuntu-latest"') }}
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Debounce: every big job needs this one, so a push that lands within this minute cancels the run here, on the
      # light pool, before any suite starts (references/ci-runners.md, queue operations).
      - name: Wait one minute for a newer push
        if: github.event_name == 'pull_request'
        run: sleep 60
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Labels are read live, not from the event, so a re-run after adding the full-suite label sees it.
          LABELS='[]'
          if [ -n "$PR_NUMBER" ]; then LABELS=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -q '[.[].name]'); fi
          python3 "$JFACTORY_DIR/scripts/verify_plan.py" full-suite --event "$GITHUB_EVENT_NAME" --labels-json "$LABELS" >> "$GITHUB_OUTPUT"
  map:
    # The map audit runs here once. Every tracked file must match a feature or a static pattern.
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.JFACTORY_LIGHT_RUNNER || vars.JFACTORY_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 "$JFACTORY_DIR/scripts/verify_plan.py" audit
      # Every skill stays discoverable in both Codex and Claude Code.
      - run: python3 "$JFACTORY_DIR/scripts/sync_skills.py" --check
  suites:
    needs: mode
    if: needs.mode.outputs.mode != 'skip'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.JFACTORY_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Names each job's own test data; the targets' seed and cleanup commands use it.
      JFACTORY_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Project runtime and dependencies go here, matching the local target's "setup" command.
      - name: Fetch the latest recorded coverage
        if: needs.mode.outputs.mode == 'planned'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Coverage from the newest whole-suite run that completed successfully, on any branch, however many runs
          # came since. A run still in progress or one that failed may hold only some shards' records, so skip it.
          # Coverage only adds suites; with none usable the plan falls back to the map.
          run=""
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=jfactory-impact-1&per_page=100" \
              --jq '.artifacts[] | select(.expired | not) | .workflow_run.id'); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '.status + "/" + (.conclusion // "")')
            if [ "$state" = "completed/success" ]; then run=$id; break; fi
          done
          if [ -n "$run" ]; then gh run download "$run" --pattern 'jfactory-impact-*' --dir .jfactory-impact || true; fi
      - name: Run this job's share of the suites the change needs
        if: needs.mode.outputs.mode == 'planned'
        run: >-
          python3 "$JFACTORY_DIR/scripts/verify_plan.py" ci
          ${{ github.event_name == 'push' && format('--push --base {0}', github.event.before) || format('--pr --base origin/{0}', github.base_ref) }}
          --impact .jfactory-impact --no-audit --shard "${{ matrix.shard }}/${{ strategy.job-total }}"
      - name: Run this job's share of every suite and record coverage
        if: needs.mode.outputs.mode == 'full'
        run: >-
          python3 "$JFACTORY_DIR/scripts/verify_plan.py" ci --all --no-audit
          --shard "${{ matrix.shard }}/${{ strategy.job-total }}" --impact-out "impact/${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: needs.mode.outputs.mode == 'full' && always()
        with:
          name: jfactory-impact-${{ matrix.shard }}
          path: impact/
          if-no-files-found: ignore
  checks:
    needs: [mode, map, suites]
    if: always()
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '"ubuntu-latest"' || vars.JFACTORY_LIGHT_RUNNER || vars.JFACTORY_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Require every parallel job to pass
        env:
          MODE_RESULT: ${{ needs.mode.result }}
          MAP_RESULT: ${{ needs.map.result }}
          MODE: ${{ needs.mode.outputs.mode }}
          SUITES_RESULT: ${{ needs.suites.result }}
        run: |
          test "$MODE_RESULT" = success
          test "$MAP_RESULT" = success
          # A skipped run (a schedule when the owner chose otherwise) ran nothing and is not a PR gate.
          if [ "$MODE" = skip ]; then exit 0; fi
          test "$SUITES_RESULT" = success
