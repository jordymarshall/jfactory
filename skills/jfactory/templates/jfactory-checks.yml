# Copy to .github/workflows/jfactory-checks.yml during setup, set JFACTORY_DIR to the installed bundle path and
# SHARDS to the mapping's "shards". Add the project's runtime steps where marked (for example actions/setup-node
# and npm ci), then make the "checks" job a required check.
#
# On a PR it fails when a tracked file is unmapped, then runs only the suites the change needs: the map's, plus
# every suite whose recorded coverage executed a changed file. The suites are split across parallel jobs by their
# recorded minutes. The whole suite runs when the owner's "full_suite" choice in the mapping says so (on request,
# nightly, on every merge or on every PR); each such run also records the coverage later PRs use.
name: jfactory checks
on:
  pull_request:
    # `labeled` lets adding the full-suite label start the whole suite on an open PR.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  JFACTORY_DIR: .agents/skills/jfactory
jobs:
  mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: mode
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 "$JFACTORY_DIR/scripts/verify_plan.py" full-suite --event "$GITHUB_EVENT_NAME" --labels "$LABELS" >> "$GITHUB_OUTPUT"
  suites:
    needs: mode
    if: needs.mode.outputs.mode != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Names each job's own test data; the targets' seed and cleanup commands use it.
      JFACTORY_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Project runtime and dependencies go here, matching the local target's "setup" command.
      - name: Fetch the latest recorded coverage
        if: needs.mode.outputs.mode == 'planned'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest successful run that ran the whole suite and uploaded coverage, on any branch.
          for run in $(gh run list --workflow jfactory-checks.yml --status success --limit 30 \
              --json databaseId --jq '.[].databaseId'); do
            gh run download "$run" --pattern 'jfactory-impact-*' --dir .jfactory-impact 2>/dev/null && break
          done
          true
      - name: Run this job's share of the suites the change needs
        if: needs.mode.outputs.mode == 'planned'
        run: >-
          python3 "$JFACTORY_DIR/scripts/verify_plan.py" ci --base "origin/${{ github.base_ref }}"
          --impact .jfactory-impact --shard "${{ matrix.shard }}/${{ strategy.job-total }}"
      - name: Run this job's share of every suite and record coverage
        if: needs.mode.outputs.mode == 'full'
        run: >-
          python3 "$JFACTORY_DIR/scripts/verify_plan.py" ci --all
          --shard "${{ matrix.shard }}/${{ strategy.job-total }}" --impact-out "impact/${{ matrix.shard }}.json"
      - uses: actions/upload-artifact@v4
        if: needs.mode.outputs.mode == 'full' && always()
        with:
          name: jfactory-impact-${{ matrix.shard }}
          path: impact/
          if-no-files-found: ignore
  checks:
    needs: [mode, suites]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every parallel job to pass
        env:
          MODE_RESULT: ${{ needs.mode.result }}
          MODE: ${{ needs.mode.outputs.mode }}
          SUITES_RESULT: ${{ needs.suites.result }}
        run: |
          test "$MODE_RESULT" = success
          # A skipped run (a schedule or merge when the owner chose otherwise) ran nothing and is not a PR gate.
          if [ "$MODE" = skip ]; then exit 0; fi
          test "$SUITES_RESULT" = success
