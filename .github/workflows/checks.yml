name: Harness checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      # Test files run in parallel so the suite stays under its two-minute bar (.jfactory/standards.md, Performance).
      - run: python3 tests/run_parallel.py
      - run: python3 skills/jfactory/scripts/check-upstream.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @playwright/cli@0.1.21 install-browser ffmpeg
      - run: python3 tests/browser_smoke.py
      - run: python3 tests/dashboard_smoke.py
